aid: conversenow
name: ConverseNow
description: 'ConverseNow is an Austin, Texas voice AI company, founded in 2018, that
  builds conversational AI virtual assistants which automate restaurant order taking
  across high-volume voice channels — inbound phone, drive-thru, SMS, and kiosk. The
  platform uses large language models to understand natural-language orders, suggest
  upsells, and confirm items in real time, and it markets an "Order Injection API"
  that pushes completed orders into restaurant point-of-sale and order-management
  systems. ConverseNow lists integrations with Brink POS, Fiserv, Focus, ItsaCheckmate,
  NCR Aloha, Olo, PAR, Qu, Xpient, Adora POS, and Deliverect, and reports processing
  more than two million conversations per month across national QSR brands. It
  publishes no public developer portal, API reference, or machine-readable specification;
  API access is reached through a sales consultation.'
