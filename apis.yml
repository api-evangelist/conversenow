  detail: >-
    ConverseNow markets an "Order Injection API" as a product on its products page and its
    own status page monitors a component literally named "API Server", but the only route
    to it is the "Book a Consultation" form — there is no developer portal, no API
    reference, and the docs.conversenow.ai and app.conversenow.ai hostnames are dangling
    DNS records with no listener on port 80 or 443.
